id: https://MontpellierRessourcesImagerie.github.io/microscopemetrics-schema/analyses/stage_drift
name: stage_drift
prefixes:
  linkml: https://w3id.org/linkml/
imports:
  - linkml:types
  - ../core
  - ../samples/beads

default_range: string


classes:
  StageDriftDataset:
    is_a: MetricsDataset
    description: >-
      A dataset containing the results of the StageDrift analysis.
    mixins:
      - HasSampleMixin
      - HasInputParametersMixin
    slot_usage:
      input_data:
        range: StageDriftInputData
      input_parameters:
        range: StageDriftInputParameters
      output:
        range: StageDriftOutput
      sample:
        range: NonPSFBeads

  StageDriftInputData:
    is_a: MetricsInputData
    slots:
      - beads_images
      - analysis_rois

  StageDriftInputParameters:
    is_a: MetricsInputParameters
    slots:
      - channel_nr
      - reference_frame_nr
      - bit_depth
      - saturation_threshold
      - snr_threshold
    slot_usage:
      channel_nr:
        ifabsent: integer(0)


  StageDriftOutput:
    is_a: MetricsOutput
    attributes:
    slots:
      - image_properties
      - mean_square_displacements
    slot_usage:
      key_measurements:
        range: StageDriftKeyMeasurement

  StageDriftKeyMeasurement:
    is_a: KeyMeasurement
    slots:
      - stabilization_timepoint_x
      - stabilization_timepoint_y
      - stabilization_timepoint_z
      - stabilization_timepoint_3d
      - relative_position_pixel_x_mean
      - relative_position_pixel_x_median
      - relative_position_pixel_x_std
      - relative_position_pixel_y_mean
      - relative_position_pixel_y_median
      - relative_position_pixel_y_std
      - relative_position_pixel_z_mean
      - relative_position_pixel_z_median
      - relative_position_pixel_z_std
      - relative_position_micron_x_mean
      - relative_position_micron_x_median
      - relative_position_micron_x_std
      - relative_position_micron_y_mean
      - relative_position_micron_y_median
      - relative_position_micron_y_std
      - relative_position_micron_z_mean
      - relative_position_micron_z_median
      - relative_position_micron_z_std
      - displacement_pixel_x_mean
      - displacement_pixel_x_median
      - displacement_pixel_x_std
      - displacement_pixel_y_mean
      - displacement_pixel_y_median
      - displacement_pixel_y_std
      - displacement_pixel_z_mean
      - displacement_pixel_z_median
      - displacement_pixel_z_std
      - displacement_micron_x_mean
      - displacement_micron_x_median
      - displacement_micron_x_std
      - displacement_micron_y_mean
      - displacement_micron_y_median
      - displacement_micron_y_std
      - displacement_micron_z_mean
      - displacement_micron_z_median
      - displacement_micron_z_std
      - displacement_micron_3d_mean
      - displacement_micron_3d_median
      - displacement_micron_3d_std
      - velocity_micron_per_sec_x_mean
      - velocity_micron_per_sec_x_median
      - velocity_micron_per_sec_x_std
      - velocity_micron_per_sec_y_mean
      - velocity_micron_per_sec_y_median
      - velocity_micron_per_sec_y_std
      - velocity_micron_per_sec_z_mean
      - velocity_micron_per_sec_z_median
      - velocity_micron_per_sec_z_std
      - velocity_micron_per_sec_3d_mean
      - velocity_micron_per_sec_3d_median
      - velocity_micron_per_sec_3d_std
      - msd_slope_pixel_x
      - msd_slope_pixel_y
      - msd_slope_pixel_z
      - msd_slope_micron_x
      - msd_slope_micron_y
      - msd_slope_micron_z
      - msd_slope_micron_3d
      - msd_intercept_pixel_x
      - msd_intercept_pixel_y
      - msd_intercept_pixel_z
      - msd_intercept_micron_x
      - msd_intercept_micron_y
      - msd_intercept_micron_z
      - msd_intercept_micron_3d
      - msd_r2_x
      - msd_r2_y
      - msd_r2_z
      - msd_r2_3d

slots:
  # Inputs
  beads_images:
    range: Image
    description: >-
      The images containing the beads. Time-lapses is required in 2 or 3D.
    required: true
    multivalued: true
  analysis_rois:
    range: Roi
    description: >-
      ROIs with a single rectangle delimiting the regions to use for analysis.
      If not provided the analysis will be performed on the whole image.
    multivalued: true
  reference_frame_nr:
    range: integer
    description: >-
      The number of the reference timepoint. This timepoint will be used as reference
      for all the measurements.
    required: true
    multivalued: false
    ifabsent: integer(0)

  # Outputs
  mean_square_displacements:
    range: Table
    description: >-
      Table containing mean square displacement measurements across the multiple images.
    multivalued: false
  stabilization_timepoint_x:
    range: integer
    description: >-
      The timepoint at which the stage achieves relative stabilization in x.
    multivalued: false
  stabilization_timepoint_y:
    range: integer
    description: >-
      The timepoint at which the stage achieves relative stabilization in y.
    multivalued: false
  stabilization_timepoint_z:
    range: integer
    description: >-
      The timepoint at which the stage achieves relative stabilization in z.
    multivalued: false
  stabilization_timepoint_3d:
    range: integer
    description: >-
      The timepoint at which the stage achieves relative stabilization in 3d.
    multivalued: false
  relative_position_pixel_x_mean:
    range: float
    description: >-
      The mean relative position of the stage in x in pixels.
    multivalued: false
  relative_position_pixel_x_median:
    range: float
    description: >-
      The median relative position of the stage in x in pixels.
    multivalued: false
  relative_position_pixel_x_std:
    range: float
    description: >-
      The standard deviation of the relative position of the stage in x in pixels.
    multivalued: false
  relative_position_pixel_y_mean:
    range: float
    description: >-
      The mean relative position of the stage in y in pixels.
    multivalued: false
  relative_position_pixel_y_median:
    range: float
    description: >-
      The median relative position of the stage in y in pixels.
    multivalued: false
  relative_position_pixel_y_std:
    range: float
    description: >-
      The standard deviation of the relative position of the stage in y in pixels.
    multivalued: false
  relative_position_pixel_z_mean:
    range: float
    description: >-
      The mean relative position of the stage in z in pixels.
    multivalued: false
  relative_position_pixel_z_median:
    range: float
    description: >-
      The median relative position of the stage in z in pixels.
    multivalued: false
  relative_position_pixel_z_std:
    range: float
    description: >-
      The standard deviation of the relative position of the stage in z in pixels.
    multivalued: false
  relative_position_micron_x_mean:
    range: float
    description: >-
      The mean relative position of the stage in x in microns.
    multivalued: false
  relative_position_micron_x_median:
    range: float
    description: >-
      The median relative position of the stage in x in microns.
    multivalued: false
  relative_position_micron_x_std:
    range: float
    description: >-
      The standard deviation of the relative position of the stage in x in microns.
    multivalued: false
  relative_position_micron_y_mean:
    range: float
    description: >-
      The mean relative position of the stage in y in microns.
    multivalued: false
  relative_position_micron_y_median:
    range: float
    description: >-
      The median relative position of the stage in y in microns.
    multivalued: false
  relative_position_micron_y_std:
    range: float
    description: >-
      The standard deviation of the relative position of the stage in y in microns.
    multivalued: false
  relative_position_micron_z_mean:
    range: float
    description: >-
      The mean relative position of the stage in z in microns.
    multivalued: false
  relative_position_micron_z_median:
    range: float
    description: >-
      The median relative position of the stage in z in microns.
    multivalued: false
  relative_position_micron_z_std:
    range: float
    description: >-
      The standard deviation of the relative position of the stage in z in microns.
    multivalued: false
  displacement_pixel_x_mean:
    range: float
    description: >-
      The mean absolute displacement of the stage in x in pixels.
    multivalued: false
  displacement_pixel_x_median:
    range: float
    description: >-
      The median absolute displacement of the stage in x in pixels.
    multivalued: false
  displacement_pixel_x_std:
    range: float
    description: >-
      The standard deviation of the absolute displacement of the stage in x in pixels.
    multivalued: false
  displacement_pixel_y_mean:
    range: float
    description: >-
      The mean absolute displacement of the stage in y in pixels.
    multivalued: false
  displacement_pixel_y_median:
    range: float
    description: >-
      The median absolute displacement of the stage in y in pixels.
    multivalued: false
  displacement_pixel_y_std:
    range: float
    description: >-
      The standard deviation of the absolute displacement of the stage in y in pixels.
    multivalued: false
  displacement_pixel_z_mean:
    range: float
    description: >-
      The mean absolute displacement of the stage in z in pixels.
    multivalued: false
  displacement_pixel_z_median:
    range: float
    description: >-
      The median absolute displacement of the stage in z in pixels.
    multivalued: false
  displacement_pixel_z_std:
    range: float
    description: >-
      The standard deviation of the absolute displacement of the stage in z in pixels.
    multivalued: false
  displacement_micron_x_mean:
    range: float
    description: >-
      The mean absolute displacement of the stage in x in microns.
    multivalued: false
  displacement_micron_x_median:
    range: float
    description: >-
      The median absolute displacement of the stage in x in microns.
    multivalued: false
  displacement_micron_x_std:
    range: float
    description: >-
      The standard deviation of the absolute displacement of the stage in x in microns.
    multivalued: false
  displacement_micron_y_mean:
    range: float
    description: >-
      The mean absolute displacement of the stage in y in microns.
    multivalued: false
  displacement_micron_y_median:
    range: float
    description: >-
      The median absolute displacement of the stage in y in microns.
    multivalued: false
  displacement_micron_y_std:
    range: float
    description: >-
      The standard deviation of the absolute displacement of the stage in y in microns.
    multivalued: false
  displacement_micron_z_mean:
    range: float
    description: >-
      The mean absolute displacement of the stage in z in microns.
    multivalued: false
  displacement_micron_z_median:
    range: float
    description: >-
      The median absolute displacement of the stage in z in microns.
    multivalued: false
  displacement_micron_z_std:
    range: float
    description: >-
      The standard deviation of the absolute displacement of the stage in z in microns.
    multivalued: false
  displacement_micron_3d_mean:
    range: float
    description: >-
      The mean absolute displacement of the stage in 3d in microns.
    multivalued: false
  displacement_micron_3d_median:
    range: float
    description: >-
      The median absolute displacement of the stage in 3d in microns.
    multivalued: false
  displacement_micron_3d_std:
    range: float
    description: >-
      The standard deviation of the absolute displacement of the stage in 3d in microns.
    multivalued: false
  velocity_micron_per_sec_x_mean:
    range: float
    description: >-
      The mean velocity at which the stage moves in x in microns per second.
    multivalued: false
  velocity_micron_per_sec_x_median:
    range: float
    description: >-
      The median velocity at which the stage moves in x in microns per second.
    multivalued: false
  velocity_micron_per_sec_x_std:
    range: float
    description: >-
      The standard deviation of the velocity at which the stage moves in x in microns per second.
    multivalued: false
  velocity_micron_per_sec_y_mean:
    range: float
    description: >-
      The mean velocity at which the stage moves in y in microns per second.
    multivalued: false
  velocity_micron_per_sec_y_median:
    range: float
    description: >-
      The median velocity at which the stage moves in y in microns per second.
    multivalued: false
  velocity_micron_per_sec_y_std:
    range: float
    description: >-
      The standard deviation of the velocity at which the stage moves in y in microns per second.
    multivalued: false
  velocity_micron_per_sec_z_mean:
    range: float
    description: >-
      The mean velocity at which the stage moves in z in microns per second.
    multivalued: false
  velocity_micron_per_sec_z_median:
    range: float
    description: >-
      The median velocity at which the stage moves in z in microns per second.
    multivalued: false
  velocity_micron_per_sec_z_std:
    range: float
    description: >-
      The standard deviation of the velocity at which the stage moves in z in microns per second.
    multivalued: false
  velocity_micron_per_sec_3d_mean:
    range: float
    description: >-
      The mean velocity at which the stage moves in 3d in microns per second.
    multivalued: false
  velocity_micron_per_sec_3d_median:
    range: float
    description: >-
      The median velocity at which the stage moves in 3d in microns per second.
    multivalued: false
  velocity_micron_per_sec_3d_std:
    range: float
    description: >-
      The standard deviation of the velocity at which the stage moves in 3d in microns per second.
    multivalued: false
  msd_slope_pixel_x:
    range: float
    description: >-
      The slope of the MSD in x in pixels^2.
    multivalued: false
  msd_slope_pixel_y:
    range: float
    description: >-
      The slope of the MSD in y in pixels^2.
    multivalued: false
  msd_slope_pixel_z:
    range: float
    description: >-
      The slope of the MSD in z in pixels^2.
    multivalued: false
  msd_slope_micron_x:
    range: float
    description: >-
      The slope of the MSD in x in microns^2.
    multivalued: false
  msd_slope_micron_y:
    range: float
    description: >-
      The slope of the MSD in y in microns^2.
    multivalued: false
  msd_slope_micron_z:
    range: float
    description: >-
      The slope of the MSD in z in microns^2.
    multivalued: false
  msd_slope_micron_3d:
    range: float
    description: >-
      The slope of the MSD in 3d in microns^2.
    multivalued: false
  msd_intercept_pixel_x:
    range: float
    description: >-
      The intercept of the MSD in x in pixels^2.
    multivalued: false
  msd_intercept_pixel_y:
    range: float
    description: >-
      The intercept of the MSD in y in pixels^2.
    multivalued: false
  msd_intercept_pixel_z:
    range: float
    description: >-
      The intercept of the MSD in z in pixels^2.
    multivalued: false
  msd_intercept_micron_x:
    range: float
    description: >-
      The intercept of the MSD in x in microns^2.
    multivalued: false
  msd_intercept_micron_y:
    range: float
    description: >-
      The intercept of the MSD in y in microns^2.
    multivalued: false
  msd_intercept_micron_z:
    range: float
    description: >-
      The intercept of the MSD in z in microns^2.
    multivalued: false
  msd_intercept_micron_3d:
    range: float
    description: >-
      The intercept of the MSD in 3d in microns^2.
    multivalued: false
  msd_r2_x:
    range: float
    description: >-
      The R^2 of the MSD in x.
    multivalued: false
  msd_r2_y:
    range: float
    description: >-
      The R^2 of the MSD in y.
    multivalued: false
  msd_r2_z:
    range: float
    description: >-
      The R^2 of the MSD in z.
    multivalued: false
  msd_r2_3d:
    range: float
    description: >-
      The R^2 of the MSD in 3d.
    multivalued: false
